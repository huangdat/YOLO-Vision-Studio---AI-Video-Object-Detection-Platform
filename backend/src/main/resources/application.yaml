server:
  port: ${SERVER_PORT:8080}
  # Finish in-flight requests on SIGTERM (docker compose stop) before closing.
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: ${APPLICATION_NAME:yolo-vision-backend}
  lifecycle:
    # Upper bound for the graceful phase; SSE streams are closed by their own lifecycle first.
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yolovision}
    username: ${DB_USERNAME:yolovision}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:yolovision}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT_MS:5000}
    # Outbox publication waits for broker confirms; unroutable messages are returned.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        # Never requeue a failed event immediately; exhausted retries are dead-lettered.
        default-requeue-rejected: false
        prefetch: ${RABBITMQ_EVENT_PREFETCH:10}
        concurrency: 1
        max-concurrency: 1
        retry:
          enabled: true
          max-attempts: ${RABBITMQ_EVENT_MAX_ATTEMPTS:3}
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
  mvc:
    problemdetails:
      enabled: true

app:
  name: ${APP_DISPLAY_NAME:YOLO Vision Studio}
  version: ${APP_VERSION:1.0.0}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  detection-stream:
    # One shared poller reads all watched jobs per tick; streams close at terminal states.
    timeout: ${DETECTION_SSE_TIMEOUT_SECONDS:1800}s
    poll-interval: ${DETECTION_SSE_POLL_INTERVAL_MS:1000}ms
    heartbeat-interval: ${DETECTION_SSE_HEARTBEAT_SECONDS:15}s
    max-connections: ${DETECTION_SSE_MAX_CONNECTIONS:100}
    reconnect-delay: 3s
  detection-api:
    max-request-bytes: ${DETECTION_API_MAX_REQUEST_BYTES:16384}
  live:
    # Live (webcam) Detection gateway: WebSocket /api/v1/live/ws -> internal ai-live-worker.
    worker-url: ${LIVE_WORKER_URL:http://localhost:8001}
    max-sessions: ${LIVE_MAX_SESSIONS:1}
    max-fps: ${LIVE_MAX_FPS:5}
    max-frame-bytes: ${LIVE_MAX_FRAME_BYTES:524288}
    image-sizes: 320,416,640
    model-sizes: ${LIVE_MODEL_SIZES:n}
    inference-timeout: ${LIVE_INFERENCE_TIMEOUT:5s}
    load-timeout: ${LIVE_LOAD_TIMEOUT:60s}
    idle-timeout: ${LIVE_IDLE_TIMEOUT:30s}
    max-session-duration: ${LIVE_MAX_SESSION_DURATION:30m}
    send-time-limit: 5s
  storage:
    # Private MinIO bucket written by the worker; the backend only reads completed artifacts.
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:yolovision}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:videos}
    region: ${MINIO_REGION:}
    connect-timeout: ${MINIO_CONNECT_TIMEOUT:5s}
    read-timeout: ${MINIO_READ_TIMEOUT:30s}
  messaging:
    command-exchange: ${RABBITMQ_COMMAND_EXCHANGE:vision.detection.commands}
    command-queue: ${RABBITMQ_COMMAND_QUEUE:vision.detection.jobs}
    command-routing-key: ${RABBITMQ_COMMAND_ROUTING_KEY:detection.execute}
    event-exchange: ${RABBITMQ_EVENT_EXCHANGE:vision.detection.events}
    event-queue: ${RABBITMQ_EVENT_QUEUE:vision.detection.events.backend}
    event-routing-key: ${RABBITMQ_EVENT_ROUTING_KEY:detection.status}
    dead-letter-exchange: ${RABBITMQ_DEAD_LETTER_EXCHANGE:vision.detection.dead-letter.exchange}
    dead-letter-queue: ${RABBITMQ_DEAD_LETTER_QUEUE:vision.detection.dead-letter}
    dead-letter-routing-key: ${RABBITMQ_DEAD_LETTER_ROUTING_KEY:detection.dead-letter}
    delivery-limit: ${RABBITMQ_DELIVERY_LIMIT:5}
    outbox:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      poll-interval: ${OUTBOX_POLL_INTERVAL:1s}
      batch-size: ${OUTBOX_BATCH_SIZE:20}
      max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
      initial-backoff: ${OUTBOX_INITIAL_BACKOFF:2s}
      max-backoff: ${OUTBOX_MAX_BACKOFF:5m}
      confirm-timeout: ${OUTBOX_CONFIRM_TIMEOUT:10s}
    jobs:
      lease-monitor-enabled: ${JOB_LEASE_MONITOR_ENABLED:true}
      lease-check-interval: ${JOB_LEASE_CHECK_INTERVAL:60s}
      processing-timeout: ${JOB_PROCESSING_TIMEOUT_SECONDS:1800}s
      queue-timeout: ${JOB_QUEUE_TIMEOUT_SECONDS:86400}s

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/v1/openapi
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /api/v1/docs
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,rabbit

logging:
  level:
    root: ${LOG_LEVEL:INFO}
