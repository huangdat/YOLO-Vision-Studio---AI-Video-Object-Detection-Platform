spring:
  datasource:
    url: jdbc:h2:mem:yolovision;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  # H2 exercises entity mappings, not the PostgreSQL-specific production schema.
  # Keep the original foundation migration and generate only the isolated H2 schema.
  flyway:
    target: "1"
  jpa:
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    password: test-only-unused
    # No broker in the fast H2 profile: listeners stay stopped and schedulers off.
    listener:
      simple:
        auto-startup: false
app:
  messaging:
    outbox:
      enabled: false
    jobs:
      lease-monitor-enabled: false
management:
  health:
    rabbit:
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
