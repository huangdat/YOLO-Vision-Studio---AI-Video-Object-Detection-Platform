# Datasource values are supplied by an isolated Testcontainers PostgreSQL instance.
# Production Flyway migrations and schema validation remain enabled in this profile.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  rabbitmq:
    password: test-only-unused
    # Messaging ITs start their own broker and re-enable these explicitly.
    listener:
      simple:
        auto-startup: false
app:
  messaging:
    outbox:
      enabled: false
    jobs:
      lease-monitor-enabled: false
management:
  health:
    rabbit:
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
