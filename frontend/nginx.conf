# Static frontend plus a same-origin /api proxy to Spring Boot (compose.production.yaml).
# The proxy keeps SSE progress and video Range responses unbuffered.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # The only browser request body is a small detection submission (backend limit: 16 KiB).
    client_max_body_size 64k;

    # add_header is inherited only by locations without their own add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Resolve "backend" through Docker's embedded DNS at request time (not once at startup),
    # so a recreated backend container with a new IP is reached without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8080;
        # With a variable and no URI part, the original request URI is passed through.
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # Same Host as the browser: the backend treats UI requests as same-origin.
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE and video streaming must not be buffered or cut by short timeouts.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # These are added above; drop the backend's copies to avoid duplicate headers.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    location /actuator/ {
        return 404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri /index.html;
    }
}
