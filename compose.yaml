name: ${COMPOSE_PROJECT_NAME:-yolo-vision-studio}

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - vision

# Detection messaging topology; the backend and the worker must agree on every value.
x-messaging-environment: &messaging-environment
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-yolovision}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
  RABBITMQ_COMMAND_EXCHANGE: ${RABBITMQ_COMMAND_EXCHANGE:-vision.detection.commands}
  RABBITMQ_COMMAND_QUEUE: ${RABBITMQ_COMMAND_QUEUE:-vision.detection.jobs}
  RABBITMQ_COMMAND_ROUTING_KEY: ${RABBITMQ_COMMAND_ROUTING_KEY:-detection.execute}
  RABBITMQ_EVENT_EXCHANGE: ${RABBITMQ_EVENT_EXCHANGE:-vision.detection.events}
  RABBITMQ_EVENT_QUEUE: ${RABBITMQ_EVENT_QUEUE:-vision.detection.events.backend}
  RABBITMQ_EVENT_ROUTING_KEY: ${RABBITMQ_EVENT_ROUTING_KEY:-detection.status}
  RABBITMQ_DEAD_LETTER_EXCHANGE: ${RABBITMQ_DEAD_LETTER_EXCHANGE:-vision.detection.dead-letter.exchange}
  RABBITMQ_DEAD_LETTER_QUEUE: ${RABBITMQ_DEAD_LETTER_QUEUE:-vision.detection.dead-letter}
  RABBITMQ_DEAD_LETTER_ROUTING_KEY: ${RABBITMQ_DEAD_LETTER_ROUTING_KEY:-detection.dead-letter}
  RABBITMQ_DELIVERY_LIMIT: ${RABBITMQ_DELIVERY_LIMIT:-5}
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-yolovision}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
  MINIO_BUCKET: ${MINIO_BUCKET:-videos}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# AI engine settings shared by the HTTP health service and the detection consumer.
x-ai-environment: &ai-environment
  AI_DEVICE: ${AI_DEVICE:-auto}
  AI_MODEL_CACHE_DIR: /data/models
  AI_TEMP_DIR: /data/temp
  AI_OUTPUT_DIR: /data/outputs
  AI_LOCAL_INPUT_DIR: /data/inputs
  AI_DEFAULT_CONFIDENCE: ${AI_DEFAULT_CONFIDENCE:-0.25}
  AI_DEFAULT_IMAGE_SIZE: ${AI_DEFAULT_IMAGE_SIZE:-960}
  AI_MAX_VIDEO_DURATION_SECONDS: ${AI_MAX_VIDEO_DURATION_SECONDS:-300}
  AI_MAX_VIDEO_SIZE_MB: ${AI_MAX_VIDEO_SIZE_MB:-200}
  AI_MAX_DOWNLOAD_HEIGHT: ${AI_MAX_DOWNLOAD_HEIGHT:-720}
  AI_CPU_THREADS: ${AI_CPU_THREADS:-4}
  AI_MAX_FRAME_PIXELS: ${AI_MAX_FRAME_PIXELS:-8294400}
  AI_FALLBACK_FPS: ${AI_FALLBACK_FPS:-30}
  AI_PROCESSING_TIMEOUT_SECONDS: ${AI_PROCESSING_TIMEOUT_SECONDS:-1800}
  AI_YOUTUBE_JS_RUNTIME: ${AI_YOUTUBE_JS_RUNTIME:-deno}

services:
  frontend:
    <<: *service-defaults
    build:
      context: ./frontend
      # Vite dev server; compose.production.yaml switches to the static "production" target.
      target: dev
    environment:
      VITE_PROXY_TARGET: http://backend:8080
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173').then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  backend:
    <<: *service-defaults
    # Lets Spring Boot finish in-flight requests (graceful shutdown) before SIGKILL.
    stop_grace_period: 30s
    build:
      context: ./backend
    environment:
      <<: *messaging-environment
      SERVER_PORT: "8080"
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-yolovision}
      DB_USERNAME: ${DB_USERNAME:-yolovision}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JOB_PROCESSING_TIMEOUT_SECONDS: ${JOB_PROCESSING_TIMEOUT_SECONDS:-1800}
      JOB_QUEUE_TIMEOUT_SECONDS: ${JOB_QUEUE_TIMEOUT_SECONDS:-86400}
      DETECTION_SSE_TIMEOUT_SECONDS: ${DETECTION_SSE_TIMEOUT_SECONDS:-1800}
      DETECTION_SSE_POLL_INTERVAL_MS: ${DETECTION_SSE_POLL_INTERVAL_MS:-1000}
      DETECTION_SSE_HEARTBEAT_SECONDS: ${DETECTION_SSE_HEARTBEAT_SECONDS:-15}
      DETECTION_SSE_MAX_CONNECTIONS: ${DETECTION_SSE_MAX_CONNECTIONS:-100}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  ai-worker:
    <<: *service-defaults
    build:
      context: ./ai-worker
    environment:
      <<: [*messaging-environment, *ai-environment]
      AI_WORKER_HOST: "0.0.0.0"
      AI_WORKER_PORT: "8000"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${AI_WORKER_PORT:-8000}:8000"
    volumes:
      - ai-model-cache:/data/models
      - ai-temp-data:/data/temp
      - ai-output-data:/data/outputs
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Long-running RabbitMQ consumer from the same image. It loads a model only when a job
  # needs it and never downloads weights unless WORKER_ALLOW_MODEL_DOWNLOAD=true. Prepare a model
  # in the shared cache first: docker compose exec ai-detection-consumer python -m app.cli models prepare --model <key>
  ai-detection-consumer:
    <<: *service-defaults
    build:
      context: ./ai-worker
    command: [python, -m, app.workers.rabbitmq_worker]
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-90s}
    environment:
      <<: [*messaging-environment, *ai-environment]
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      WORKER_PREFETCH_COUNT: ${WORKER_PREFETCH_COUNT:-1}
      JOB_MAX_RETRIES: ${JOB_MAX_RETRIES:-3}
      WORKER_ALLOW_MODEL_DOWNLOAD: ${WORKER_ALLOW_MODEL_DOWNLOAD:-false}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-30}
      WORKER_SHUTDOWN_TIMEOUT_SECONDS: ${WORKER_SHUTDOWN_TIMEOUT_SECONDS:-60}
      WORKER_HEALTH_FILE: /tmp/worker-health.json
    volumes:
      - ai-model-cache:/data/models
      - ai-temp-data:/data/temp
    healthcheck:
      # The image healthcheck probes HTTP; this process reports through its health file instead.
      test: [CMD, python, -c, "import json, os, sys, time; p='/tmp/worker-health.json'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 60 and json.load(open(p))['connected'] else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    <<: *service-defaults
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME:-yolovision}
      POSTGRES_USER: ${DB_USERNAME:-yolovision}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10

  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:4.2-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-yolovision}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # Healthy only once the AMQP listener accepts connections; "ping" passes slightly
      # earlier, which let dependents log a spurious connection error on startup.
      test: [CMD, rabbitmq-diagnostics, -q, check_port_connectivity]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  minio:
    <<: *service-defaults
    build:
      context: ./infrastructure/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-yolovision}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: [server, /data, --address, ":9000", --console-address, ":9001"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9000/minio/health/ready]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

networks:
  vision:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  ai-model-cache:
  ai-temp-data:
  ai-output-data:
